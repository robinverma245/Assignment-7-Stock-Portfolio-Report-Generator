name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pylint requests requests-mock setuptools

      - name: Run tests
        run: python -m pytest

      - name: Run Pylint
        run: python -m pylint portfolio.py report.py tests/test_portfolio.py tests/test_report.py
